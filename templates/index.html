<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>认知姿态守护者 v3.1 - 智能分析平台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #e0e0e0;
            --message-bot-bg: #ffffff;
            --message-user-bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --input-bg: #ffffff;
            --sidebar-bg: #ffffff;
            --shadow: 0 20px 40px rgba(0,0,0,0.1);
            --chart-grid: #ddd;
            --copy-btn-bg: rgba(0,0,0,0.1);
        }

        body.dark {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --card-bg: #1e1e2e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border-color: #2a2a3e;
            --message-bot-bg: #2a2a3e;
            --message-user-bg: linear-gradient(135deg, #4a6fa5 0%, #6b4e9e 100%);
            --input-bg: #2a2a3e;
            --sidebar-bg: #1e1e2e;
            --shadow: 0 20px 40px rgba(0,0,0,0.3);
            --chart-grid: #3a3a4e;
            --copy-btn-bg: rgba(255,255,255,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 20px;
        }

        .chat-panel {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .chat-header {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: white;
            padding: 20px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .theme-toggle {
            background: rgba(255,255,255,0.2);
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
            transform: scale(1.02);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--card-bg);
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-content-wrapper {
            max-width: 70%;
            position: relative;
        }

        .message-content {
            padding: 12px 18px;
            border-radius: 20px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: var(--message-user-bg);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.bot .message-content {
            background: var(--message-bot-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .copy-btn {
            position: absolute;
            bottom: -25px;
            right: 0;
            background: var(--copy-btn-bg);
            border: none;
            border-radius: 15px;
            padding: 4px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
            opacity: 0;
        }

        .message:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: #667eea;
            color: white;
        }

        .copy-btn.copied {
            background: #2ecc71;
            color: white;
            opacity: 1;
        }

        .message-meta {
            font-size: 0.7rem;
            margin-top: 5px;
            opacity: 0.6;
            color: var(--text-secondary);
        }

        .chat-input-area {
            padding: 20px;
            background: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.02);
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .card {
            background: var(--sidebar-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: background 0.3s ease;
        }

        .card h3 {
            margin-bottom: 15px;
            color: var(--text-primary);
            border-left: 4px solid #667eea;
            padding-left: 12px;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .stats-value {
            font-weight: bold;
            color: #667eea;
        }

        .chart-container {
            margin: 15px 0;
            height: 200px;
            position: relative;
        }

        canvas {
            max-height: 200px;
            width: 100%;
        }

        .clear-btn, .export-btn {
            width: 100%;
            padding: 10px;
            background: var(--border-color);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            color: var(--text-primary);
            transition: background 0.3s;
        }

        .export-btn {
            background: #667eea;
            color: white;
        }

        .export-btn:hover {
            background: #5a67d8;
        }

        .clear-btn:hover {
            background: #e0e0e0;
        }

        body.dark .clear-btn:hover {
            background: #3a3a4e;
        }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 10px 15px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .badge-audit { background: #e74c3c; color: white; }
        .badge-translate { background: #2ecc71; color: white; }

        .sidebar::-webkit-scrollbar, .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track, .chat-messages::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb, .chat-messages::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 3px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ecc71;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            z-index: 1000;
            animation: fadeOut 2s ease forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(-50%) translateY(0); }
            70% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); visibility: hidden; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-panel">
            <div class="chat-header">
                <div>
                    <h1>🧠 认知姿态守护者 v3.1</h1>
                    <p>智能分析 | 自动模式切换 | 自反审计 | 可视化统计</p>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()">🌙 深色模式</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <div class="message bot">
                    <div class="message-content-wrapper">
                        <div class="message-content">
                            👋 你好！我是认知姿态守护者<br>
                            📊 右侧面板展示了实时统计图表<br>
                            💬 试试输入一些内容开始分析吧！<br>
                            📋 鼠标悬停在消息上可显示复制按钮
                        </div>
                        <div class="message-meta">刚刚</div>
                    </div>
                </div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="messageInput" 
                       placeholder="输入你想说的..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="card">
                <h3>📊 模式分布</h3>
                <div class="chart-container">
                    <canvas id="modeChart"></canvas>
                </div>
                <div class="stats-item">
                    <span>审计模式</span>
                    <span class="stats-value" id="auditCount">0</span>
                </div>
                <div class="stats-item">
                    <span>翻译模式</span>
                    <span class="stats-value" id="translateCount">0</span>
                </div>
            </div>

            <div class="card">
                <h3>🎯 姿态分布</h3>
                <div class="chart-container">
                    <canvas id="postureChart"></canvas>
                </div>
                <div id="postureStats" style="font-size: 0.8rem; margin-top: 10px;"></div>
            </div>

            <div class="card">
                <h3>📈 每日活动 (最近7天)</h3>
                <div class="chart-container">
                    <canvas id="activityChart"></canvas>
                </div>
            </div>

            <div class="card">
                <h3>📋 快速统计</h3>
                <div class="stats-item">
                    <span>会话轮次</span>
                    <span class="stats-value" id="sessionCount">0</span>
                </div>
                <div class="stats-item">
                    <span>姿态记录</span>
                    <span class="stats-value" id="postureTotal">0</span>
                </div>
                <div class="stats-item">
                    <span>模式切换</span>
                    <span class="stats-value" id="switchCount">0</span>
                </div>
                <div class="stats-item">
                    <span>审计通过率</span>
                    <span class="stats-value" id="passRate">0%</span>
                </div>
                <button class="export-btn" onclick="exportChat()">📥 导出对话记录</button>
                <button class="clear-btn" onclick="clearHistory()">🗑️ 清除历史</button>
            </div>
        </div>
    </div>

    <script>
        let modeChart, postureChart, activityChart;
        let isWaiting = false;

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function copyToClipboard(text, message = '✓ 已复制到剪贴板') {
            navigator.clipboard.writeText(text).then(() => {
                showToast(message);
            }).catch(() => {
                showToast('❌ 复制失败');
            });
        }

        function copyMessage(element) {
            const wrapper = element.closest('.message-content-wrapper');
            const content = wrapper.querySelector('.message-content').innerText;
            copyToClipboard(content);
            const btn = element;
            btn.classList.add('copied');
            btn.textContent = '✓ 已复制';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.textContent = '📋 复制';
            }, 2000);
        }

        function addMessageWithCopy(text, sender, timestamp) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            messageDiv.innerHTML = `
                <div class="message-content-wrapper">
                    <div class="message-content">${text.replace(/\n/g, '<br>')}</div>
                    <button class="copy-btn" onclick="copyMessage(this)">📋 复制</button>
                    <div class="message-meta">${timestamp || new Date().toLocaleTimeString()}</div>
                </div>
            `;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addMessage(text, sender, timestamp) {
            addMessageWithCopy(text, sender, timestamp);
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-toggle');
            const isDark = body.classList.toggle('dark');
            btn.innerHTML = isDark ? '☀️ 浅色模式' : '🌙 深色模式';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateChartsTheme();
        }

        function updateChartsTheme() {
            const isDark = document.body.classList.contains('dark');
            const textColor = isDark ? '#e0e0e0' : '#333333';
            
            [modeChart, postureChart, activityChart].forEach(chart => {
                if (chart) {
                    chart.options.plugins.legend.labels.color = textColor;
                    if (chart.options.scales?.y?.ticks) chart.options.scales.y.ticks.color = textColor;
                    if (chart.options.scales?.x?.ticks) chart.options.scales.x.ticks.color = textColor;
                    chart.update();
                }
            });
        }

        function initCharts() {
            const ctxMode = document.getElementById('modeChart').getContext('2d');
            const ctxPosture = document.getElementById('postureChart').getContext('2d');
            const ctxActivity = document.getElementById('activityChart').getContext('2d');
            
            modeChart = new Chart(ctxMode, {
                type: 'doughnut',
                data: { labels: ['审计模式', '翻译模式'], datasets: [{ data: [0, 0], backgroundColor: ['#e74c3c', '#2ecc71'] }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } }
            });
            
            postureChart = new Chart(ctxPosture, {
                type: 'bar',
                data: { labels: [], datasets: [{ label: '次数', data: [], backgroundColor: '#667eea' }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
            
            activityChart = new Chart(ctxActivity, {
                type: 'line',
                data: { labels: [], datasets: [{ label: '对话次数', data: [], borderColor: '#667eea', backgroundColor: 'rgba(102,126,234,0.1)', fill: true, tension: 0.3 }] },
                options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'top' } } }
            });
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || isWaiting) return;
            
            addMessage(message.replace(/\n/g, '<br>'), 'user');
            input.value = '';
            isWaiting = true;
            showTyping();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                hideTyping();
                
                if (data.success) {
                    let botMessage = data.mode === 'audit' 
                        ? `【审计模式】\n姿态: ${data.posture}\n置信度: ${(data.confidence * 100).toFixed(0)}%\n\n${data.remind}`
                        : `【翻译模式】\n润色结果:\n${data.final_output || data.polished}`;
                    addMessage(botMessage, 'bot');
                    updateStats();
                } else {
                    addMessage(`❌ 错误: ${data.error}`, 'bot');
                }
            } catch (error) {
                hideTyping();
                addMessage(`❌ 网络错误: ${error.message}`, 'bot');
            }
            isWaiting = false;
        }

        function showTyping() {
            const messagesDiv = document.getElementById('chatMessages');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `<div class="message-content-wrapper"><div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div></div>`;
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        async function updateStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                
                document.getElementById('sessionCount').textContent = data.session_count || 0;
                document.getElementById('auditCount').textContent = data.mode_counts?.audit || 0;
                document.getElementById('translateCount').textContent = data.mode_counts?.translate || 0;
                document.getElementById('postureTotal').textContent = data.posture_stats?.total || 0;
                document.getElementById('switchCount').textContent = data.mode_switch_stats?.total_switches || 0;
                document.getElementById('passRate').textContent = `${data.reflection_stats?.pass_rate || 0}%`;
                
                if (modeChart) {
                    modeChart.data.datasets[0].data = [data.mode_counts?.audit || 0, data.mode_counts?.translate || 0];
                    modeChart.update();
                }
                
                if (postureChart && data.posture_counts) {
                    const labels = Object.keys(data.posture_counts);
                    const values = Object.values(data.posture_counts);
                    postureChart.data.labels = labels;
                    postureChart.data.datasets[0].data = values;
                    postureChart.update();
                }
                
                if (data.posture_stats?.by_posture) {
                    document.getElementById('postureStats').innerHTML = data.posture_stats.by_posture.map(p => 
                        `<div class="stats-item"><span>${p.posture}</span><span class="stats-value">${p.count}次 (${(p.avg_confidence*100).toFixed(0)}%)</span></div>`
                    ).join('');
                }
                
                if (activityChart && data.daily_activity) {
                    const dates = Object.keys(data.daily_activity).sort();
                    const counts = dates.map(d => data.daily_activity[d]);
                    activityChart.data.labels = dates.map(d => d.slice(5));
                    activityChart.data.datasets[0].data = counts;
                    activityChart.update();
                }
            } catch (error) {
                console.error('更新统计失败:', error);
            }
        }

        function exportChat() {
            const messages = document.querySelectorAll('.message');
            let exportText = `认知姿态守护者 v3.1 - 对话记录\n导出时间: ${new Date().toLocaleString()}\n${'='.repeat(50)}\n\n`;
            
            messages.forEach(msg => {
                const isUser = msg.classList.contains('user');
                const content = msg.querySelector('.message-content').innerText;
                const time = msg.querySelector('.message-meta')?.innerText || '';
                exportText += `${isUser ? '👤 用户' : '🤖 守护者'} ${time}\n${content}\n${'-'.repeat(30)}\n`;
            });
            
            copyToClipboard(exportText, '✓ 对话已复制到剪贴板');
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isWaiting) sendMessage();
        }

        async function clearHistory() {
            if (confirm('确定清除所有历史吗？')) {
                await fetch('/api/clear', { method: 'POST' });
                updateStats();
                document.getElementById('chatMessages').innerHTML = `
                    <div class="message bot">
                        <div class="message-content-wrapper">
                            <div class="message-content">历史已清除！开始新的对话吧。</div>
                            <div class="message-meta">刚刚</div>
                        </div>
                    </div>
                `;
                showToast('✓ 历史已清除');
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') document.body.classList.add('dark');
        
        initCharts();
        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>
</html>
